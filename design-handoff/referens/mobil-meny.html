<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Gursch – mobil, meny</title>
<!-- Referens for den nya Gursch-designen. Statisk mockup: valt kort, vald botniva och all speldata ar harkodade exempel. Stilarna (farger, typsnitt, matt, skuggor) ar de som ska galla. -->
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#c9a55a}a:hover{color:#e2c684}
input::placeholder,textarea::placeholder{color:#6d6b58}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #c9a55a;outline-offset:2px}
.gk-wood{background-image:url(../assets/planktextur.svg);background-size:640px 256px;background-position:center top}
.gk-btn,.gk-press-dark,.gk-press-light,.gk-card,.gk-input,.gk-seg{transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .12s cubic-bezier(.2,.8,.2,1),background-color .12s ease-out,border-color .12s ease-out,color .12s ease-out}
@media (hover:hover){
.gk-press-dark:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #10211b!important}
.gk-press-light:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #f0e8cc!important}
.gk-ghost-dark:hover{background-color:#10211b!important;border-color:#10211b!important;color:#f0e8cc!important}
.gk-solid-dark:hover{background-color:#1f3d30!important}
.gk-ghost-light:hover{background-color:rgba(240,232,204,.12)!important;border-color:#f0e8cc!important}
.gk-ghost-warn:hover{background-color:#c05a48!important;color:#10211b!important}
.gk-solid-warn:hover{background-color:#8e2a23!important}
.gk-card:hover{transform:translateY(-4px)!important}
.gk-card.is-sel:hover{transform:translateY(-11px)!important}
.gk-card.is-off:hover{transform:none!important}
.gk-input:hover{background-color:#fffdf4!important}
.gk-seg[aria-pressed="false"]:hover{background-color:rgba(240,232,204,.14)!important}
.gk-seg-light[aria-pressed="false"]:hover{background-color:#e4dab8!important}
}
.gk-press-dark:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #10211b!important}
.gk-press-light:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #f0e8cc!important}
.gk-btn:active{transform:translateY(2px)}
.gk-card:active{transform:translateY(-1px)!important}
.gk-card.is-sel:active{transform:translateY(-5px)!important}
.gk-card.is-off,.gk-card.is-off:active{transform:none!important;cursor:not-allowed}
.gk-btn:disabled,.gk-press-light:disabled,.gk-press-dark:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.gk-input:focus{outline:2px solid #10211b;outline-offset:0;box-shadow:6px 6px 0 #c9a55a}
.gk-select{appearance:none;-webkit-appearance:none}
@media (prefers-reduced-motion:reduce){.gk-btn,.gk-press-dark,.gk-press-light,.gk-card,.gk-input,.gk-seg{transition:none}}
</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #10211b; color: #f0e8cc; font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <header style="flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: #0a1612">
    <img src="../assets/gursch-marke-sticker-tjock.png" alt="Gursch" style="height: 48px; width: auto; margin-right: 2px">
    <span style="padding: 5px 9px; border: 2px solid #3b5347; border-radius: 4px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 14px; font-weight: 700; line-height: 1; letter-spacing: 0.1em">RUNDA 1</span>
    <span style="padding: 5px 9px; border: 2px solid #c9a55a; border-radius: 4px; background: #c9a55a; color: #10211b; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 14px; font-weight: 700; line-height: 1; letter-spacing: 0.1em">×10</span>
    <span style="padding: 5px 9px; border: 2px solid #3b5347; border-radius: 4px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 14px; font-weight: 700; line-height: 1; letter-spacing: 0.1em">CDC5</span>
    <button type="button" class="gk-btn gk-ghost-light" aria-label="Meny" aria-expanded="true" style="margin-left: auto; width: 44px; height: 44px; border-radius: 4px; border: 2px solid #f0e8cc; background: #f0e8cc; color: #10211b; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></button>
  </header>

  <div style="flex: 1 1 auto; padding: 8px 8px 12px; display: flex; min-height: 0">
    <div style="flex: 1 1 auto; border-radius: 28px; padding: 6px; background: #f0e8cc; box-shadow: 0 6px 0 #07100c">
      <div style="height: 100%; box-sizing: border-box; padding: 12px 10px 14px; display: flex; flex-direction: column; border-radius: 22px; border: 2px solid #0a1612; background: #1f3d30">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <div style="width: 100%; box-sizing: border-box; padding: 7px 4px; border-radius: 4px; background: #0a1612; text-align: center"><div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.04em">Bot Bengt</div><div style="font-size: 13px; font-weight: 600; white-space: nowrap; color: #9fb0a2">0 kr</div></div>
            <div style="display: flex; gap: 4px; align-items: center; justify-content: center"><span style="padding: 4px 8px; border: 2px solid #0a1612; border-radius: 999px; background: #f0e8cc; color: #10211b; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 13px; font-weight: 700; line-height: 1">D</span></div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <div style="width: 100%; box-sizing: border-box; padding: 7px 4px; border-radius: 4px; background: #0a1612; text-align: center"><div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.04em">Bot Greta</div><div style="font-size: 13px; font-weight: 600; white-space: nowrap; color: #7fcf9c">+10 kr</div></div>
            <div style="display: flex; gap: 4px; align-items: center; justify-content: center"><div style="width: 24px; height: 34px; flex: 0 0 auto; box-sizing: border-box; border-radius: 3px; border: 2px solid #0a1612; background: #fbf7e9; color: #b3362c; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center">2</div></div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <div style="width: 100%; box-sizing: border-box; padding: 7px 4px; border-radius: 4px; background: #0a1612; text-align: center"><div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.04em">Bot Sixten</div><div style="font-size: 13px; font-weight: 600; white-space: nowrap; color: #9fb0a2">0 kr</div></div>
            <div style="display: flex; gap: 4px; align-items: center; justify-content: center"><div style="width: 24px; height: 34px; flex: 0 0 auto; box-sizing: border-box; border-radius: 3px; border: 2px solid #0a1612; background: #fbf7e9; color: #b3362c; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center">8</div><span style="padding: 4px 8px; border-radius: 4px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 13px; font-weight: 700; line-height: 1; letter-spacing: 0.08em; white-space: nowrap; border: 2px solid #0a1612; background: #c9a55a; color: #10211b">FLOP</span></div>
          </div>
        </div>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center">
          <div style="position: relative; width: 324px; height: 128px; box-sizing: border-box; padding: 32px 8px 0 0; display: flex; align-items: center; justify-content: center">
            <img src="../assets/gurktryck-filt.png" alt="" style="position: absolute; left: 0; top: 0; width: 324px; height: 128px">
            <div style="position: relative; font-family: 'Alfa Slab One', Rockwell, Georgia, serif; font-size: 36px; line-height: 1; letter-spacing: 0.05em; color: rgba(8,18,14,.55); height: 60px">GURSCH</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 20px; font-weight: 700; line-height: 1; letter-spacing: 0.24em; color: #c9a55a">STICKSPEL · STICK 1</div>
            <div style="font-size: 17px; font-weight: 500; color: #f0e8cc">Du leder sticket</div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
          <div style="min-width: 110px; padding: 8px 16px; border-radius: 4px; background: #f0e8cc; color: #10211b; border: 2px solid #0a1612; box-shadow: 4px 4px 0 #c9a55a; text-align: center; white-space: nowrap">
            <div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.04em">Axel (du)</div>
            <div style="font-size: 14px; font-weight: 600; color: #a8322a">−10 kr</div>
          </div>
          <div style="display: flex; gap: 6px; align-items: center"><span style="padding: 4px 8px; border-radius: 4px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 14px; font-weight: 700; line-height: 1; letter-spacing: 0.08em; white-space: nowrap; border: 2px solid #0a1612; background: #0a1612; color: #f0e8cc">SLASK 1/3</span></div>
        </div>
      </div>
    </div>
  </div>

  <footer style="position: relative; flex: 0 0 auto; padding: 14px 12px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: #0a1612">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 5px; background: rgba(240,232,204,.14)"><div style="width: 100%; height: 100%; background: #c9a55a"></div></div>
    <div style="font-size: 15px; font-weight: 500; line-height: 1.3; color: #f0e8cc; text-align: center">Du leder – välj 1–5 kort som bildar en kombination</div>
    <div style="width: 100%; display: flex; justify-content: space-between">
      <span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 14px; font-weight: 700; line-height: 1.2; letter-spacing: 0.1em; color: #c9a55a">0 AV 1–5 VALDA</span>
      <span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 14px; font-weight: 700; line-height: 1.2; letter-spacing: 0.1em; color: #9fb0a2">DIN TUR · 45 s</span>
    </div>
    <div style="display: flex; gap: 6px; align-items: flex-end; height: 84px">
      <button type="button" class="gk-card" aria-label="3♦" style="width: 56px; height: 76px; box-sizing: border-box; padding: 5px 6px; display: flex; flex-direction: column; align-items: flex-start; border-radius: 5px; border: 2px solid #0a1612; background: #fbf7e9; color: #b3362c; box-shadow: 3px 4px 0 rgba(0,0,0,.42); cursor: pointer; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; transform: translateY(0)"><span style="font-size: 14px; font-weight: 700; line-height: 1">3♦</span><span style="flex: 1 1 auto; align-self: stretch; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; line-height: 1">3</span></button><button type="button" class="gk-card" aria-label="9♣" style="width: 56px; height: 76px; box-sizing: border-box; padding: 5px 6px; display: flex; flex-direction: column; align-items: flex-start; border-radius: 5px; border: 2px solid #0a1612; background: #fbf7e9; color: #10211b; box-shadow: 3px 4px 0 rgba(0,0,0,.42); cursor: pointer; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; transform: translateY(0)"><span style="font-size: 14px; font-weight: 700; line-height: 1">9♣</span><span style="flex: 1 1 auto; align-self: stretch; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; line-height: 1">9</span></button><button type="button" class="gk-card" aria-label="J♥" style="width: 56px; height: 76px; box-sizing: border-box; padding: 5px 6px; display: flex; flex-direction: column; align-items: flex-start; border-radius: 5px; border: 2px solid #0a1612; background: #fbf7e9; color: #b3362c; box-shadow: 3px 4px 0 rgba(0,0,0,.42); cursor: pointer; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; transform: translateY(0)"><span style="font-size: 14px; font-weight: 700; line-height: 1">J♥</span><span style="flex: 1 1 auto; align-self: stretch; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; line-height: 1">J</span></button><button type="button" class="gk-card" aria-label="Q♦" style="width: 56px; height: 76px; box-sizing: border-box; padding: 5px 6px; display: flex; flex-direction: column; align-items: flex-start; border-radius: 5px; border: 2px solid #0a1612; background: #fbf7e9; color: #b3362c; box-shadow: 3px 4px 0 rgba(0,0,0,.42); cursor: pointer; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; transform: translateY(0)"><span style="font-size: 14px; font-weight: 700; line-height: 1">Q♦</span><span style="flex: 1 1 auto; align-self: stretch; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; line-height: 1">Q</span></button><button type="button" class="gk-card" aria-label="K♠" style="width: 56px; height: 76px; box-sizing: border-box; padding: 5px 6px; display: flex; flex-direction: column; align-items: flex-start; border-radius: 5px; border: 2px solid #0a1612; background: #fbf7e9; color: #10211b; box-shadow: 3px 4px 0 rgba(0,0,0,.42); cursor: pointer; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; transform: translateY(0)"><span style="font-size: 14px; font-weight: 700; line-height: 1">K♠</span><span style="flex: 1 1 auto; align-self: stretch; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; line-height: 1">K</span></button>
    </div>
    <div style="width: 100%; min-height: 48px; display: flex; gap: 10px"><button type="button" class="gk-press-light" disabled="disabled" style="flex: 1 1 0; min-width: 0; min-height: 48px; padding: 0 8px; border-radius: 4px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer; white-space: nowrap; border: 2px solid #0a1612; background: #c9a55a; color: #10211b; box-shadow: 4px 4px 0 #f0e8cc">SPELA</button></div>
  </footer>
  <div style="position: absolute; left: 0; top: 60px; right: 0; bottom: 0; z-index: 5; background: rgba(6,10,8,.74)">
    <nav aria-label="Meny" style="position: absolute; right: 12px; top: 8px; width: 240px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-radius: 6px; border: 2px solid #0a1612; background: #f0e8cc; box-shadow: 6px 6px 0 #0a1612">
      <button type="button" class="gk-btn gk-ghost-dark" style="min-height: 48px; padding: 0 14px; border-radius: 4px; background: transparent; color: #10211b; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 0.1em; text-align: left; cursor: pointer; border: 2px solid #10211b">HISTORIK</button>
      <button type="button" class="gk-btn gk-ghost-dark" style="min-height: 48px; padding: 0 14px; border-radius: 4px; background: transparent; color: #10211b; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 0.1em; text-align: left; cursor: pointer; border: 2px solid #10211b">CHATT</button>
      <button type="button" class="gk-btn gk-ghost-warn" style="min-height: 48px; padding: 0 14px; border-radius: 4px; background: transparent; color: #10211b; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 0.1em; text-align: left; cursor: pointer; border: 2px solid #c05a48">RAPPORTERA FEL</button>
      <button type="button" class="gk-btn gk-ghost-dark" style="min-height: 48px; padding: 0 14px; border-radius: 4px; background: transparent; color: #10211b; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 0.1em; text-align: left; cursor: pointer; border: 2px solid #10211b">LÄMNA SPELET</button>
    </nav>
  </div>
</div>
</body>
</html>

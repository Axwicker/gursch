name: Tester

# Motorns och serverns tester. Layouttesterna (npm run test:layout) kräver webbläsare och körs lokalt.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
